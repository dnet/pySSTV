[project]
name = "pySSTV"
version = "0.5.10"
readme = "README.md"
description='Python classes for generating Slow-scan Television transmissions'
requires-python = ">=3.11"
authors = [{name = "András Veres-Szentkirályi", email = "vsza@vsza.hu"}]
license = "MIT"
license-files = ["LICENSE.txt"]
keywords = ["HAM", "SSTV", "slow-scan", "television", "Scottie", "Martin", "Robot", "Pasokon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Communications :: Ham Radio",
    "Topic :: Multimedia :: Video :: Conversion",
    "Operating System :: OS Independent",
]
dependencies = [
    "pillow==13.0.0",
]

[project.urls]
Homepage = "https://github.com/dnet/pySSTV"

[project.scripts]
pysstv = "pysstv.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest",
]
