[project]
name = "pySSTV"
version = "0.5.8"
readme = "README.md"
description='Python classes for generating Slow-scan Television transmissions'
requires-python = ">=3.10"
dependencies = [
    "pillow==12.3.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mock==1.0.1",
    "nose==1.3.0",
]
